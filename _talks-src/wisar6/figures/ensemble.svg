<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" text-anchor="middle">
  <!-- Static replacement for the former Mermaid flowchart (ensemble structure) -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bbb"/>
    </marker>
  </defs>

  <!-- edges -->
  <g fill="none" stroke="#333" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M250,55 C330,55 350,105 418,105"/>   <!-- GBQR spatial -> average (states) -->
    <path d="M250,165 C330,165 350,115 418,115"/> <!-- WISAR6 -> average (states) -->
    <path d="M250,175 C330,175 350,225 418,225"/> <!-- WISAR6 -> average (US) -->
    <path d="M250,285 C330,285 350,235 418,235"/> <!-- GBQR 3-source -> average (US) -->
    <path d="M562,110 C640,110 660,160 738,160"/> <!-- average (states) -> flusion -->
    <path d="M562,230 C640,230 660,180 738,180"/> <!-- average (US) -> flusion -->
  </g>
  <path d="M250,365 L738,365" fill="none" stroke="#bbb" stroke-width="1.8" marker-end="url(#arrow-dim)"/>

  <!-- inputs -->
  <rect x="40" y="20" width="210" height="70" rx="6" fill="#ececf6" stroke="#9a9ac8" stroke-width="1.5"/>
  <text x="145" y="50">GBQR spatial</text><text x="145" y="74">(states)</text>

  <rect x="40" y="135" width="210" height="70" rx="6" fill="#fbe3d6" stroke="#D55E00" stroke-width="2.5"/>
  <text x="145" y="177">WISAR6</text>

  <rect x="40" y="250" width="210" height="70" rx="6" fill="#ececf6" stroke="#9a9ac8" stroke-width="1.5"/>
  <text x="145" y="280">GBQR 3-source</text><text x="145" y="304">(US)</text>

  <rect x="40" y="340" width="210" height="50" rx="6" fill="#f2f2f2" stroke="#bbb" stroke-width="1.5"/>
  <text x="145" y="372" fill="#999">GBQR + NSSP</text>

  <!-- averages -->
  <rect x="420" y="80" width="140" height="60" rx="6" fill="#ececf6" stroke="#9a9ac8" stroke-width="1.5"/>
  <text x="490" y="117">average</text>

  <rect x="420" y="200" width="140" height="60" rx="6" fill="#ececf6" stroke="#9a9ac8" stroke-width="1.5"/>
  <text x="490" y="237">average</text>

  <!-- outputs -->
  <rect x="740" y="135" width="320" height="70" rx="6" fill="#dbeaf5" stroke="#0072B2" stroke-width="2.5"/>
  <text x="900" y="165">UMass-flusion 2026/27</text><text x="900" y="189">wk inc flu hosp</text>

  <rect x="740" y="335" width="320" height="60" rx="6" fill="#f2f2f2" stroke="#bbb" stroke-width="1.5"/>
  <text x="900" y="360" fill="#999">UMass-flusion</text><text x="900" y="383" fill="#999">NSSP ED-visit target</text>
</svg>
